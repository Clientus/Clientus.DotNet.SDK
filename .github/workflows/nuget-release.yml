name: NuGet Release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH to allow NuGet.org publication"
        required: true
        default: "DRY_RUN"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Clientus.DotNet.sln

      - name: Build
        run: dotnet build Clientus.DotNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Clientus.DotNet.sln --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack Clientus.ApiClient/Clientus.ApiClient.csproj --configuration Release --no-build --output artifacts
          dotnet pack Clientus.Core/Clientus.Core.csproj --configuration Release --no-build --output artifacts

      - name: Validate package contents
        run: |
          ls -lah artifacts
          test "$(find artifacts -name '*.nupkg' | wc -l)" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

  publish:
    needs: validate
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_publish == 'PUBLISH')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate